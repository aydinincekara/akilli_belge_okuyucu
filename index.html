<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yapay Zeka Belge Okuyucu</title>
    <!-- PDF.js ve Mammoth.js Kütüphaneleri -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        .dashboard { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 2fr; gap: 25px; }
        .panel { background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); border: 1px solid #334155; }
        .header { grid-column: 1 / -1; text-align: center; padding: 10px 0 30px 0; }
        h1 { color: #38bdf8; margin: 0; font-size: 2.5em; letter-spacing: 1px; }
        p.subtitle { color: #94a3b8; font-size: 1.1em; }
        .upload-area { border: 2px dashed #475569; padding: 40px 20px; text-align: center; border-radius: 8px; cursor: pointer; transition: all 0.3s; margin-bottom: 20px; background: #0f172a; }
        .upload-area:hover { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
        .progress-container { width: 100%; background: #334155; border-radius: 8px; height: 15px; overflow: hidden; margin-top: 20px; display: none; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #38bdf8, #818cf8); transition: width 0.4s ease; box-shadow: 0 0 10px #38bdf8; }
        .status-badge { margin-top: 15px; padding: 8px 12px; border-radius: 6px; background: #334155; display: inline-block; font-size: 0.9em; font-weight: bold; color: #cbd5e1; }
        textarea { width: 100%; height: 400px; background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 8px; padding: 15px; resize: none; box-sizing: border-box; font-size: 1.05em; line-height: 1.5; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        button { flex: 1; min-width: 90px; background: linear-gradient(90deg, #0284c7, #38bdf8); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; font-size: 0.9em; }
        button:hover { filter: brightness(1.1); box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
        button:disabled { background: #475569; cursor: not-allowed; box-shadow: none; color: #94a3b8; }
        .btn-stop { background: linear-gradient(90deg, #ef4444, #f87171); }
        input[type="range"] { width: 100%; margin-top: 10px; cursor: pointer; }
        
        /* Mobil Uyumluluk (Responsive) CSS Kodları */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .dashboard { grid-template-columns: 1fr; gap: 15px; }
            h1 { font-size: 1.8em; }
            .panel { padding: 15px; }
            textarea { height: 300px; font-size: 1em; }
            .btn-group { flex-direction: column; gap: 8px; }
            button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>🎙️ Akıllı Belge Okuyucu</h1>
            <p class="subtitle">Verileriniz cihazınızdan çıkmaz. En akıcı Türkçe ses için Microsoft Edge kullanın.</p>
        </div>
        
        <div class="panel">
            <h3 style="margin-top: 0; color: #e2e8f0;">Yükleme & Ayarlar</h3>
            <div class="upload-area" onclick="document.getElementById('file-input').click()">
                <span style="font-size: 2em; display: block; margin-bottom: 10px;">📄</span>
                <span id="file-name-label">Buraya tıklayıp PDF veya Word (DOCX) Seçin</span>
                <input type="file" id="file-input" hidden accept=".pdf,.docx" onchange="document.getElementById('file-name-label').innerText = this.files[0].name">
            </div>
            
            <label style="color: #cbd5e1; font-weight: 500;">Okuma Hızı: <span id="speed-val">Normal (1x)</span></label>
            <!-- Hız 3x'e kadar çıkarıldı -->
            <input type="range" id="speed" min="0.5" max="5" step="0.1" value="1">
            
            <div class="btn-group">
                <button id="btn-process" onclick="processFile()">DÖKÜMAN ANALİZ</button>
            </div>
            <!-- Mobil uyum için başlat, duraklat ve durdur butonlarını yan yana veya alt alta hizalayan grup -->
            <div class="btn-group" style="flex-direction: row; flex-wrap: wrap;">
                <button id="btn-play" onclick="playText(lastCharIndex)" disabled>▶ Başlat</button>
                <button id="btn-pause" onclick="pauseText()" disabled>⏸ Duraklat</button>
                <button id="btn-stop" class="btn-stop" onclick="stopText()" disabled>⏹ Durdur</button>
            </div>
            
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="status-badge" id="status-badge">Hazır. Dosya bekleniyor.</div>
        </div>
        
        <div class="panel">
            <h3 style="margin-top: 0; color: #e2e8f0;">Okuma Ekranı</h3>
            <textarea id="text-display" placeholder="Belge metni burada görüntülenecek ve okundukça takip edilecek..."></textarea>
        </div>
    </div>

    <script>
        // PDF.js worker ayarı
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        let currentText = "";
        let synth = window.speechSynthesis;
        let lastCharIndex = 0; 

        function updateUI(progress, status, color) {
            document.getElementById('progress-container').style.display = 'block';
            document.getElementById('progress-bar').style.width = progress + '%';
            let badge = document.getElementById('status-badge');
            badge.innerText = status;
            badge.style.color = color;
        }

        async function processFile() {
            const file = document.getElementById('file-input').files[0];
            if (!file) return alert('Lütfen bir belge seçin!');
            
            updateUI(10, '⚙️ Dosya okunuyor (10%)', '#38bdf8');
            stopText();
            document.getElementById('text-display').value = "";
            currentText = "";

            try {
                const arrayBuffer = await file.arrayBuffer();
                const ext = file.name.split('.').pop().toLowerCase();

                if (ext === 'pdf') {
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        currentText += content.items.map(item => item.str).join(' ') + "\n";
                        updateUI(10 + (80 * (i / pdf.numPages)), `🔍 PDF İşleniyor: Sayfa ${i}/${pdf.numPages}`, '#38bdf8');
                    }
                } else if (ext === 'docx') {
                    updateUI(50, '🔍 Word belgesi çözümleniyor (50%)', '#38bdf8');
                    const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                    currentText = result.value;
                } else {
                    throw new Error("Desteklenmeyen dosya formatı");
                }

                document.getElementById('text-display').value = currentText.trim();
                updateUI(100, '✅ Metin çıkarıldı. Dinlemeye hazır.', '#4ade80');
                
                document.getElementById('btn-play').disabled = false;
                document.getElementById('btn-pause').disabled = false;
                document.getElementById('btn-stop').disabled = false;

            } catch (error) {
                updateUI(100, '❌ Hata: ' + error.message, '#f87171');
                document.getElementById('progress-bar').style.background = '#f87171';
            }
        }

        function playText(startIndex = 0) {
            if (synth.paused && startIndex === lastCharIndex && startIndex !== 0) {
                synth.resume();
                updateUI(100, '▶ Oynatılıyor...', '#4ade80');
                return;
            }
            
            const textDisplay = document.getElementById('text-display');
            const fullText = textDisplay.value;
            if (!fullText) return;

            synth.cancel(); 
            
            const textToRead = fullText.substring(startIndex);
            if (!textToRead) return;

            const utterance = new SpeechSynthesisUtterance(textToRead);
            utterance.lang = 'tr-TR';
            utterance.rate = parseFloat(document.getElementById('speed').value);
            
            const voices = synth.getVoices();
            const trVoices = voices.filter(v => v.lang.includes('tr'));
            if (trVoices.length > 0) {
                utterance.voice = trVoices.find(v => v.name.includes('Edge') || v.name.includes('Emel') || v.name.includes('Tolga')) || trVoices[0];
            }

            utterance.onboundary = (event) => {
                if (event.name === 'word') {
                    let actualIndex = startIndex + event.charIndex;
                    lastCharIndex = actualIndex; 
                    
                    let wordLength = event.charLength;
                    if (!wordLength) {
                        const match = fullText.substring(actualIndex).match(/[\s\.\,\!\?]/);
                        wordLength = match ? match.index : fullText.length - actualIndex;
                    }
                    
                    textDisplay.focus(); 
                    textDisplay.setSelectionRange(actualIndex, actualIndex + Math.max(1, wordLength));

                    const scrollPercentage = actualIndex / fullText.length;
                    const targetScrollTop = (textDisplay.scrollHeight * scrollPercentage) - (textDisplay.clientHeight / 2);
                    textDisplay.scrollTop = Math.max(0, targetScrollTop);
                }
            };

            utterance.onend = () => {
                if (lastCharIndex + 50 >= fullText.length) {
                    updateUI(100, '✅ Okuma tamamlandı.', '#4ade80');
                    textDisplay.setSelectionRange(0, 0); 
                    textDisplay.scrollTop = 0;
                    lastCharIndex = 0;
                }
            };
            
            synth.speak(utterance);
            updateUI(100, '▶ Oynatılıyor...', '#4ade80');
        }

        function pauseText() {
            if (synth.speaking && !synth.paused) {
                synth.pause();
                updateUI(100, '⏸ Duraklatıldı', '#fbbf24');
            }
        }

        function stopText() {
            synth.cancel();
            lastCharIndex = 0; 
            updateUI(100, '⏹ Durduruldu', '#94a3b8');
        }

        document.getElementById('speed').addEventListener('change', function() {
            if (synth.speaking && !synth.paused) {
                playText(lastCharIndex);
            }
        });

        document.getElementById('speed').addEventListener('input', function() {
            document.getElementById('speed-val').innerText = this.value + 'x';
        });

        window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
    </script>
</body>
</html>
